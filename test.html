<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぷよクエ共通テスト</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1 id="mainTitle">ぷよクエ共通テスト</h1>

    <div class="progressBox">
        <div id="sectionTitle"></div>
        <div id="progressText"></div>

        <div class="progressBar">
            <div id="progressFill"></div>
        </div>
    </div>

    <div id="questionArea"></div>

    <div style="margin-top:30px; display:flex; gap:10px;">
        <button id="prevBtn" onclick="prevSection()">前へ</button>
        <button id="nextBtn" onclick="nextSection()">次へ</button>
    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyDLn3UccEHfvov-5wQ8X0IFgjZLPO7iHwniEB0zg0yH6ahLsRrZ1oTYduA8yF6dWIL/exec";

let questions = [];
let sections = [];
let currentSectionIndex = 0;

const categoryOrder = [
    "初級",
    "中級",
    "上級",
    "超上級",
    "管理者問題①",
    "管理者問題②"
];

const categoryTitleMap = {
    "初級": "大問1　初級",
    "中級": "大問2　中級",
    "上級": "大問3　上級",
    "超上級": "大問4　超上級",
    "管理者問題①": "大問5　管理者問題①",
    "管理者問題②": "大問6　管理者問題②"
};

async function loadQuestions(){

    const round = localStorage.getItem("round");

    document.getElementById("mainTitle").innerText =
        `第${round}回 ぷよクエ共通テスト`;

    try{

        const res = await fetch(
            API_URL + "?action=getTest&round=" + encodeURIComponent(round)
        );

        questions = await res.json();

        localStorage.setItem(
            "questions",
            JSON.stringify(questions)
        );

        if(questions.length === 0){

            document.getElementById("sectionTitle").innerText =
                "問題がありません";

            document.getElementById("questionArea").innerHTML =
                "<p>この回の問題がまだ登録されていません。</p>";

            document.getElementById("prevBtn").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";

            return;
        }

        buildSections();
        showSection();

    }catch(error){

        console.error(error);

        document.getElementById("sectionTitle").innerText =
            "読み込みエラー";

        document.getElementById("questionArea").innerHTML =
            "<p>問題の取得に失敗しました。</p>";
    }
}

function buildSections(){

    sections = [];

    categoryOrder.forEach(category => {

        const sectionQuestions =
            questions.filter(q => q.category === category);

        if(sectionQuestions.length > 0){

            sections.push({
                category: category,
                title: categoryTitleMap[category],
                questions: sectionQuestions
            });

        }

    });

    const otherQuestions =
        questions.filter(q => !categoryOrder.includes(q.category));

    if(otherQuestions.length > 0){

        sections.push({
            category: "未分類",
            title: "未分類",
            questions: otherQuestions
        });

    }
}

function showSection(){

    const section = sections[currentSectionIndex];

    document.getElementById("sectionTitle").innerText =
        section.title;

    document.getElementById("progressText").innerText =
        `大問 ${currentSectionIndex + 1} / ${sections.length}`;

    document.getElementById("progressFill").style.width =
        `${((currentSectionIndex + 1) / sections.length) * 100}%`;

    let html = "";

    section.questions.forEach(q => {

        const globalIndex = questions.findIndex(item => item.id === q.id);
        const questionNumber = globalIndex + 1;

        html += `
            <div class="info">
                <p><strong>問${questionNumber}</strong></p>

                <p>${escapeHtml(q.question)}</p>

                <p style="
                    font-size:0.9em;
                    color:#666;
                    margin-top:-5px;
                    margin-bottom:15px;
                ">
                    出題者：${escapeHtml(q.name || "不明")}
                </p>

                <label class="choiceLabel">
                    <input
                        type="radio"
                        name="q${questionNumber}"
                        value="1"
                        onchange="saveAnswer(${questionNumber}, 1)"
                    >
                    ① ${escapeHtml(q.choice1)}
                </label>

                <label class="choiceLabel">
                    <input
                        type="radio"
                        name="q${questionNumber}"
                        value="2"
                        onchange="saveAnswer(${questionNumber}, 2)"
                    >
                    ② ${escapeHtml(q.choice2)}
                </label>

                <label class="choiceLabel">
                    <input
                        type="radio"
                        name="q${questionNumber}"
                        value="3"
                        onchange="saveAnswer(${questionNumber}, 3)"
                    >
                    ③ ${escapeHtml(q.choice3)}
                </label>

                <label class="choiceLabel">
                    <input
                        type="radio"
                        name="q${questionNumber}"
                        value="4"
                        onchange="saveAnswer(${questionNumber}, 4)"
                    >
                    ④ ${escapeHtml(q.choice4)}
                </label>
            </div>
        `;

    });

    document.getElementById("questionArea").innerHTML = html;

    restoreAnswers();

    document.getElementById("prevBtn").style.display =
        currentSectionIndex === 0 ? "none" : "block";

    document.getElementById("nextBtn").innerText =
        currentSectionIndex === sections.length - 1
        ? "結果へ"
        : "次へ";

    window.scrollTo(0, 0);
}

function saveAnswer(questionNumber, answer){

    localStorage.setItem(
        `q${questionNumber}`,
        String(answer)
    );

}

function restoreAnswers(){

    for(let i = 1; i <= questions.length; i++){

        const savedAnswer =
            localStorage.getItem(`q${i}`);

        if(savedAnswer){

            const radio = document.querySelector(
                `input[name="q${i}"][value="${savedAnswer}"]`
            );

            if(radio){
                radio.checked = true;
            }
        }
    }
}

function nextSection(){

    const unanswered = getUnansweredInCurrentSection();

    if(unanswered.length > 0){

        const go = confirm(
            `この大問に未回答の問題が ${unanswered.length} 問あります。\n\nそのまま進みますか？`
        );

        if(!go){
            return;
        }
    }

    if(currentSectionIndex >= sections.length - 1){

        const allUnanswered = getAllUnanswered();

        if(allUnanswered.length > 0){

            const submit = confirm(
                `未回答の問題が ${allUnanswered.length} 問あります。\n\nこのまま結果へ進みますか？`
            );

            if(!submit){
                return;
            }
        }

        window.location.href = "result.html";
        return;
    }

    currentSectionIndex++;
    showSection();
}

function prevSection(){

    if(currentSectionIndex > 0){
        currentSectionIndex--;
        showSection();
    }
}

function getUnansweredInCurrentSection(){

    const section = sections[currentSectionIndex];
    const unanswered = [];

    section.questions.forEach(q => {

        const globalIndex = questions.findIndex(item => item.id === q.id);
        const questionNumber = globalIndex + 1;

        if(localStorage.getItem(`q${questionNumber}`) === null){
            unanswered.push(questionNumber);
        }

    });

    return unanswered;
}

function getAllUnanswered(){

    const unanswered = [];

    for(let i = 1; i <= questions.length; i++){

        if(localStorage.getItem(`q${i}`) === null){
            unanswered.push(i);
        }

    }

    return unanswered;
}

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

loadQuestions();

</script>

</body>
</html>
